<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L-appen · last ned</title>
<meta name="description" content="Øv til teoriprøven med L-appen. 624 spørsmål med full forklaring, på 9 språk.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://l-appen.app/">
<meta property="og:title" content="L-appen · øv til teoriprøven">
<meta property="og:description" content="624 spørsmål med full forklaring, på 9 språk. Gratis hver dag.">
<meta property="og:url" content="https://l-appen.app/">
<meta property="og:type" content="website">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#F1F2F6;color:#101114;display:flex;align-items:center;
       justify-content:center;padding:28px 20px;line-height:1.45}
  .kort{width:100%;max-width:400px;text-align:center}
  /* L-merket: proporsjoner maalt fra app-ikonet, i % saa det skalerer */
  .logo{display:inline-flex;align-items:center;gap:9px;margin-bottom:26px}
  .lskilt{width:54px;height:54px;background:#fff;border:2px solid #D9DCE1;
          border-radius:7%;position:relative;flex:none}
  .lskilt::before{content:'';position:absolute;left:29.8%;top:22.0%;
                  width:16.7%;height:59.8%;background:#E0201B}
  .lskilt::after{content:'';position:absolute;left:29.8%;bottom:18.2%;
                 width:43.9%;height:15.9%;background:#E0201B}
  .ordmerke{font-size:30px;font-weight:800;letter-spacing:-.03em}
  h1{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-bottom:10px}
  .ingress{font-size:15.5px;color:#4a4d52;margin-bottom:26px}
  .knapper{display:flex;flex-direction:column;gap:11px}
  a.knapp{display:flex;align-items:center;justify-content:center;gap:9px;
          padding:15px 18px;border-radius:13px;text-decoration:none;
          font-size:16.5px;font-weight:700;background:#101114;color:#fff;
          transition:transform .12s,opacity .12s}
  a.knapp:active{transform:scale(.98)}
  a.knapp svg{width:20px;height:20px;fill:currentColor;flex:none}
  .venter{padding:15px 18px;border-radius:13px;background:#E8EAEE;color:#5a5d63;
          font-size:15px;font-weight:600}
  .status{font-size:14px;color:#6C6E73;margin-bottom:16px;min-height:20px}
  .fot{margin-top:26px;font-size:13px;color:#8b8e93}
  .fot a{color:#6C6E73}
  @media (prefers-color-scheme:dark){
    body{background:#101114;color:#fff}
    .ingress{color:#a9acb2} h1{color:#fff}
    a.knapp{background:#fff;color:#101114}
    .venter{background:#1e2126;color:#a9acb2}
    .fot{color:#7c8087} .fot a{color:#9aa0a6}
  }
</style>
</head>
<body>
<div class="kort">
  <div class="logo"><div class="lskilt"></div><div class="ordmerke">-appen</div></div>
  <h1>Øv til teoriprøven</h1>
  <p class="ingress">624 spørsmål med full forklaring, på 9 språk.<br>Gratis hver dag.</p>
  <p class="status" id="status"></p>
  <div class="knapper" id="knapper"></div>
  <p class="fot"><a href="https://studio-glazebrook.no/personvern/l-appen/">Personvern</a> · Studio Glazebrook</p>
</div>
<script>
(function () {
  'use strict';

  // Naar Android-appen er ute i Play: sett denne til true. Ingenting annet
  // trenger aa endres - QR-koder og klistremerker fortsetter aa virke.
  var PLAY_ER_UTE = false;

  var APPSTORE = 'https://apps.apple.com/no/app/l-appen/id6795498125';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.edword92.lappen';

  // Kampanjemerking: ?k=oslo gir ct=oslo, slik at App Analytics og Play
  // Install Referrer kan skille kildene. Uten parameter brukes 'direkte'.
  var p = new URLSearchParams(location.search);
  var kilde = (p.get('k') || 'direkte').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40) || 'direkte';

  var lenkeIos = APPSTORE + '?ct=' + encodeURIComponent(kilde) + '&mt=8';
  var lenkePlay = PLAY + '&referrer=' + encodeURIComponent('utm_source=' + kilde + '&utm_medium=qr');

  var ua = navigator.userAgent || '';
  var erIos = /iPad|iPhone|iPod/.test(ua) ||
              // iPadOS 13+ melder seg som Mac, men har berøringsskjerm
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var erAndroid = /Android/.test(ua);

  var IKON_APPLE = '<svg viewBox="0 0 24 24"><path d="M16.7 12.7c0-2.4 2-3.6 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.1 1.7 2.4 3 2.4 1.2 0 1.6-.8 3.1-.8 1.4 0 1.9.8 3.1.7 1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7 0 0-2.5-.9-2.5-3.8zM14.3 5.6c.7-.8 1.1-1.9 1-3-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.5z"/></svg>';
  var IKON_PLAY = '<svg viewBox="0 0 24 24"><path d="M3.6 2.4c-.3.3-.5.8-.5 1.4v16.4c0 .6.2 1.1.5 1.4l.1.1 9.2-9.2v-.2L3.6 2.4zm12.4 6.1L13.4 11l2.6 2.6 3.1-1.8c.9-.5.9-1.4 0-1.9l-3.1-1.4zM12.7 11.7L3.7 20.7c.3.3.8.3 1.4 0l10.2-5.8-2.6-3.2zM4.1 3.3l8.6 8.4 2.6-2.6L5.5 3.3c-.5-.3-1-.3-1.4 0z"/></svg>';

  var status = document.getElementById('status');
  var knapper = document.getElementById('knapper');

  function knapp(url, ikon, tekst) {
    return '<a class="knapp" href="' + url + '" rel="noopener">' + ikon + tekst + '</a>';
  }

  // Desktop og ukjente enheter: vis begge valg, ingen omdirigering.
  if (!erIos && !erAndroid) {
    knapper.innerHTML = knapp(lenkeIos, IKON_APPLE, 'App Store') +
      (PLAY_ER_UTE ? knapp(lenkePlay, IKON_PLAY, 'Google Play')
                   : '<div class="venter">Google Play: kommer snart</div>');
    return;
  }

  if (erAndroid && !PLAY_ER_UTE) {
    status.textContent = 'Android-versjonen er like rundt hjørnet.';
    knapper.innerHTML = '<div class="venter">Google Play: kommer snart</div>';
    return;
  }

  // Mobil: send videre med en gang. Knappen staar igjen som reserve
  // dersom omdirigeringen blokkeres av nettleseren.
  var maal = erIos ? lenkeIos : lenkePlay;
  knapper.innerHTML = erIos ? knapp(maal, IKON_APPLE, 'Åpne App Store')
                            : knapp(maal, IKON_PLAY, 'Åpne Google Play');
  status.textContent = 'Åpner butikken …';
  // replace(), ikke assign(): da havner ikke denne siden i historikken,
  // og tilbakeknappen tar deg dit du kom fra.
  location.replace(maal);
})();
</script>
</body>
</html>
